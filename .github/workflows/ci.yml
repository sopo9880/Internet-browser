name: Browser v0.x CI (Windows + Titanium Android)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - run: flutter create --project-name=internet_browser --org=io.github.sopo9880 --platforms=windows .
      - name: Restore project widget test after Flutter bootstrap
        run: git show HEAD:test/widget_test.dart > test/widget_test.dart
      - name: Test release metadata and signing template (without secrets)
        run: |
          python3 -m unittest discover -s tool/tests -p 'test_*.py' -v
          python3 tool/release_metadata.py
          python3 tool/configure_android_signing.py
      - run: flutter pub get
      - name: Generate Windows launcher icon for tests
        run: dart run flutter_launcher_icons -f flutter_launcher_icons_windows.yaml
      - run: dart format --output=write lib test
      - run: flutter analyze
      - run: flutter test
  android:
    # Required Titanium/Chromium native APK; never a Flutter Android shell.
    # Safe disposable isolated runner, no production signing keys on PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, chromium-large]
    timeout-minutes: 360
    needs: [quality, chromium_extension_source_pin]
    steps:
      - uses: actions/checkout@v4
      - name: Validate native app version
        run: python3 tool/release_metadata.py
      - name: Compile real Titanium Chromium ARM64 Android browser
        shell: bash
        run: |
          set -euo pipefail
          read -r BROWSER_NATIVE_VERSION BROWSER_NATIVE_VERSION_CODE < <(
            python3 -c 'from tool.release_metadata import parse_pubspec; from pathlib import Path; m=parse_pubspec(Path("pubspec.yaml").read_text()); print(m.version, m.version_code)'
          )
          export BROWSER_NATIVE_VERSION BROWSER_NATIVE_VERSION_CODE
          WORKSPACE="$RUNNER_TEMP/titanium-browser-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          bash tool/chromium/build_titanium_prototype.sh "$WORKSPACE" product-candidate
          mkdir -p build/android-native
          cp "$WORKSPACE/output/"*PRODUCT-CANDIDATE*.apk build/android-native/native-chromium.apk
          cp "$WORKSPACE/output/provenance.json" build/android-native/provenance.json
          test -s build/android-native/native-chromium.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-titanium-native-candidate
          path: build/android-native/*
          if-no-files-found: error
          retention-days: 7

  windows:
    # Flutter 3.35.x cannot identify Visual Studio 2026 on windows-latest.
    runs-on: windows-2022
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - run: flutter create --project-name=internet_browser --org=io.github.sopo9880 --platforms=windows .
      - run: flutter pub get
      - name: Generate Windows parcel icon only
        run: dart run flutter_launcher_icons -f flutter_launcher_icons_windows.yaml
      - name: Verify Windows build toolchain
        run: flutter doctor -v
      - run: flutter build windows --release
      - name: Include verified ByeDPI Windows proxy engine
        shell: pwsh
        run: ./tool/install_byedpi.ps1
      - name: Locate or install Inno Setup 6
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found"
          }
      - name: Build Windows update installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $matches = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\d+\.\d+\.\d+)'
          if (-not $matches) { throw "Missing semantic app version" }
          $version = $matches.Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" "installer\InternetBrowser.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: browser-windows-setup
          path: dist/Internet-browser-Windows-Setup-v*.exe
          if-no-files-found: error

  chromium_extension_source_pin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate real Chromium MV3 research source pin
        run: |
          python3 -m unittest discover -s tool/tests -p test_titanium_pin.py -v
          python3 -m unittest discover -s tool/tests -p test_welcome_crx.py -v
          python3 tool/chromium/titanium_pin.py
          bash -n tool/chromium/build_titanium_prototype.sh
          python3 -m unittest discover -s tool/tests -p test_titanium_product.py -v
      - name: Clarify native compilation requirement
        run: |
          echo "Source pinned and prototype builder syntax checked."
          echo "Real Chromium engine compilation requires a separate 32GB/120GB runner."
          echo "AdBlock installation and in-app engine remain UNVERIFIED."

  android_chromium_runtime_gate:
    # A compiled native Chromium APK is necessary, but NOT sufficient:
    # require independently generated real Android integration evidence.
    runs-on: ubuntu-24.04
    needs: [quality, windows, chromium_extension_source_pin, android]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-titanium-native-candidate
          path: build/android-native
      - name: Verify native Android functional tests (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          read -r VERSION VERSION_CODE < <(
            python3 -c 'from tool.release_metadata import parse_pubspec; from pathlib import Path; m=parse_pubspec(Path("pubspec.yaml").read_text()); print(m.version, m.version_code)'
          )
          python3 -m tool.chromium.require_native_engine \
            --apk build/android-native/native-chromium.apk \
            --provenance build/android-native/provenance.json \
            --smoke-report build/android-native/android-ci-smoke.json \
            --version "$VERSION" --version-code "$VERSION_CODE" \
            --integration-commit "$GITHUB_SHA"
