name: Browser v0.x CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - run: flutter create --project-name=internet_browser --org=io.github.sopo9880 --platforms=android,windows .
      - run: python3 tool/prepare_platforms.py
      - run: flutter pub get
      - run: dart format --output=write lib test
      - run: flutter analyze
      - run: flutter test
  android:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - run: flutter create --project-name=internet_browser --org=io.github.sopo9880 --platforms=android .
      - run: python3 tool/prepare_platforms.py
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Browser-Android-v0.1.0
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - run: flutter create --project-name=internet_browser --org=io.github.sopo9880 --platforms=windows .
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: Browser-Windows-v0.1.0
          path: build/windows/x64/runner/Release/**
          if-no-files-found: error
