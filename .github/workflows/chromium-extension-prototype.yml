name: Android Chromium Titanium native source build (no release)
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      flavor:
        description: Titanium APK variant
        required: true
        default: product-candidate
        type: choice
        options: [product-candidate, research]
permissions:
  contents: read
jobs:
  native_extension_source_build:
    # Only trusted same-repo PRs explicitly labeled for this expensive job.
    # No production signing credentials, especially on a self-hosted runner.
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'chromium-build'))
    runs-on: [self-hosted, linux, x64, chromium-large]
    timeout-minutes: 360
    env:
      CHROMIUM_FLAVOR: ${{ github.event_name == 'workflow_dispatch' && inputs.flavor || 'product-candidate' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check trusted source pin and build script
        run: |
          python3 -m unittest discover -s tool/tests -p test_titanium_pin.py -v
          python3 -m unittest discover -s tool/tests -p test_welcome_crx.py -v
          python3 tool/chromium/titanium_pin.py
          python3 -m unittest discover -s tool/tests -p test_titanium_product.py -v
          python3 -m tool.chromium.titanium_product --help
          bash -n tool/chromium/build_titanium_prototype.sh
      - name: Compile real Chromium 155 Android native browser (product ID candidate)
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$RUNNER_TEMP/titanium-extension-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          bash tool/chromium/build_titanium_prototype.sh "$WORKSPACE" "$CHROMIUM_FLAVOR"
          mkdir -p build/chromium-prototype
          cp "$WORKSPACE/output/provenance.json" build/chromium-prototype/
          cp "$WORKSPACE/output/"*.apk build/chromium-prototype/
      - uses: actions/upload-artifact@v4
        with:
          name: Chromium-155-NATIVE-PRODUCT-CANDIDATE-NOT-RELEASE
          path: build/chromium-prototype/*
          retention-days: 1
          if-no-files-found: error
