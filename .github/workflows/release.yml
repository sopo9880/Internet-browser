name: Publish signed v0.x release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: internet-browser-production-release
  cancel-in-progress: false

jobs:
  prepare:
    # Never expose release credentials to pull_request code or other branches.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      version_code: ${{ steps.version.outputs.version_code }}
      publish: ${{ steps.existing.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate 0.x version and calculate increasing Android versionCode
        id: version
        run: python3 tool/release_metadata.py
      - name: Skip a version already released
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "This version is already published; leaving it unchanged."
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null 2>&1; then
            EXISTING_SHA=$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")
            if [ "$EXISTING_SHA" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $RELEASE_TAG points to a different commit."
              exit 1
            fi
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"

  quality:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Generate native project wrappers
        run: flutter create --project-name=internet_browser --org=io.github.sopo9880 --platforms=windows .
      - run: git show HEAD:test/widget_test.dart > test/widget_test.dart
      - name: Check Python release metadata and signing helpers
        run: python3 -m unittest discover -s tool/tests -p 'test_*.py' -v
      - run: flutter pub get
      - name: Generate Windows icon for static checks
        run: dart run flutter_launcher_icons -f flutter_launcher_icons_windows.yaml
      - run: dart format --output=write lib test
      - run: flutter analyze
      - run: flutter test

  android:
    # Genuine Chromium-native Android build; NEVER Flutter's empty shell.
    # Untrusted upstream compilation happens on isolated self-hosted hardware.
    # Production signing secrets are NEVER available to this runner.
    needs: [prepare, quality]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: [self-hosted, linux, x64, chromium-large]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Validate 0.x native product version metadata
        run: python3 tool/release_metadata.py
      - name: Compile pinned native Titanium Android Chromium product
        shell: bash
        run: |
          set -euo pipefail
          read -r BROWSER_NATIVE_VERSION BROWSER_NATIVE_VERSION_CODE < <(
            python3 -c 'from tool.release_metadata import parse_pubspec; from pathlib import Path; m=parse_pubspec(Path("pubspec.yaml").read_text()); print(m.version, m.version_code)'
          )
          export BROWSER_NATIVE_VERSION BROWSER_NATIVE_VERSION_CODE
          WORKSPACE="$RUNNER_TEMP/titanium-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          bash tool/chromium/build_titanium_prototype.sh "$WORKSPACE" product-candidate
          mkdir -p build/android-native
          cp "$WORKSPACE/output/"*PRODUCT-CANDIDATE*.apk build/android-native/native-chromium.apk
          cp "$WORKSPACE/output/provenance.json" build/android-native/provenance.json
          test -s build/android-native/native-chromium.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-native-chromium-candidate
          path: build/android-native/*
          if-no-files-found: error
          retention-days: 14

  android_gate:
    # Source compilation is necessary but never sufficient:
    # require Android navigation/MV3 AdBlock/ByeDPI/media/data-migration proof.
    needs: [prepare, quality, android]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-native-chromium-candidate
          path: build/android-native
      - name: Block incomplete native Chromium before production signing
        shell: bash
        run: |
          set -euo pipefail
          read -r VERSION VERSION_CODE < <(
            python3 -c 'from tool.release_metadata import parse_pubspec; from pathlib import Path; m=parse_pubspec(Path("pubspec.yaml").read_text()); print(m.version, m.version_code)'
          )
          python3 -m tool.chromium.require_native_engine \
            --apk build/android-native/native-chromium.apk \
            --provenance build/android-native/provenance.json \
            --smoke-report build/android-native/android-ci-smoke.json \
            --version "$VERSION" --version-code "$VERSION_CODE" \
            --integration-commit "$GITHUB_SHA"

  android_sign:
    # Secrets are exposed ONLY on this trusted GitHub-hosted MAIN release job,
    # AFTER native source, automated tests and functional acceptance pass.
    needs: [prepare, quality, android, android_gate]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: release-native-chromium-candidate
          path: build/android-native
      - name: Validate existing production Android keystore privately
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          blob = base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"], validate=True)
          if len(blob) < 64:
              raise SystemExit("Invalid production keystore")
          Path(os.environ["RUNNER_TEMP"], "internet-browser-release.p12").write_bytes(blob)
          PY
          KEYSTORE="$RUNNER_TEMP/internet-browser-release.p12"
          test -s "$KEYSTORE"
          keytool -list -storetype PKCS12 -keystore "$KEYSTORE" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" \
            | grep -q 'PrivateKeyEntry'
      - name: Sign exact Chromium build with v0.2.0 Android signing identity
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          read -r VERSION VERSION_CODE < <(
            python3 -c 'from tool.release_metadata import parse_pubspec; from pathlib import Path; m=parse_pubspec(Path("pubspec.yaml").read_text()); print(m.version, m.version_code)'
          )
          SDK="$ANDROID_SDK_ROOT"
          test -n "$SDK"
          AAPT2=$(find "$SDK/build-tools" -type f -name aapt2 | sort -V | tail -n1)
          APKSIGNER=$(find "$SDK/build-tools" -type f -name apksigner | sort -V | tail -n1)
          ZIPALIGN=$(find "$SDK/build-tools" -type f -name zipalign | sort -V | tail -n1)
          test -x "$AAPT2" && test -x "$APKSIGNER" && test -x "$ZIPALIGN"
          SRC="build/android-native/native-chromium.apk"
          python3 -m tool.chromium.titanium_product verify \
            --apk "$SRC" --aapt2 "$AAPT2" \
            --package io.github.sopo9880.internet_browser \
            --version-code "$VERSION_CODE" --version-name "$VERSION"
          mkdir -p dist
          "$ZIPALIGN" -f -p 4 "$SRC" "$RUNNER_TEMP/native-aligned.apk"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/internet-browser-release.p12" --ks-type PKCS12 \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "dist/Internet-browser-Android-v$VERSION.apk" \
            "$RUNNER_TEMP/native-aligned.apk"
          SIGNED="dist/Internet-browser-Android-v$VERSION.apk"
          "$APKSIGNER" verify --verbose "$SIGNED"
          INFO=$("$APKSIGNER" verify --print-certs "$SIGNED")
          # Cert hash observed in the v0.2.0 production release run.
          EXPECTED_CERT="08116054e3a1de465da9357649c045fbb06e6d06f2c6108cda5e6dfd81d82e4a"
          if ! printf '%s\n' "$INFO" | grep -Fqi "$EXPECTED_CERT"; then
            echo "::error title=Android signing mismatch::Certificate differs from v0.2.0; existing user data must be protected."
            exit 1
          fi
          python3 -m tool.chromium.titanium_product verify \
            --apk "$SIGNED" --aapt2 "$AAPT2" \
            --package io.github.sopo9880.internet_browser \
            --version-code "$VERSION_CODE" --version-name "$VERSION"
          echo "Native Chromium APK matches the original production Android signing certificate."
      - uses: actions/upload-artifact@v4
        with:
          name: release-signed-android-apk
          path: dist/Internet-browser-Android-v*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Remove production signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/internet-browser-release.p12" "$RUNNER_TEMP/native-aligned.apk"

  windows:
    needs: [prepare, quality]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: windows-2022
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Generate Windows project
        run: flutter create --project-name=internet_browser --org=io.github.sopo9880 --platforms=windows .
      - run: flutter pub get
      - name: Generate Windows parcel icon only
        run: dart run flutter_launcher_icons -f flutter_launcher_icons_windows.yaml
      - run: flutter build windows --release
      - name: Include verified ByeDPI Windows proxy engine
        shell: pwsh
        run: ./tool/install_byedpi.ps1
      - name: Find or install Inno Setup 6
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found."
          }
      - name: Produce Windows installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc "/DAppVersion=$env:VERSION" "installer\InternetBrowser.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup build failed." }
          $file = "dist\Internet-browser-Windows-Setup-v$env:VERSION.exe"
          if (-not (Test-Path $file)) { throw "Missing Windows installer." }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-installer
          path: dist/Internet-browser-Windows-Setup-v*.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [prepare, quality, android, android_gate, android_sign, windows]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-signed-android-apk
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-windows-installer
          path: dist
      - name: Verify exact asset names and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          APK="Internet-browser-Android-v$VERSION.apk"
          EXE="Internet-browser-Windows-Setup-v$VERSION.exe"
          test -s "dist/$APK"
          test -s "dist/$EXE"
          (cd dist && sha256sum "$APK" "$EXE" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Publish GitHub Release only after BOTH signed builds succeed
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/Internet-browser-Android-v$VERSION.apk"
          EXE="dist/Internet-browser-Windows-Setup-v$VERSION.exe"
          RELEASE_NOTES="Windows installer and Android APK signed using the stored release key. Read docs/UPDATES.md before upgrading. SHA-256 checksums are attached."
          RELEASE_NOTES="$RELEASE_NOTES Android is built from native Titanium Chromium, not Flutter Android. Post-release device checklist: docs/POST_RELEASE_ANDROID_VALIDATION.md. Chromium license/source: docs/CHROMIUM_NATIVE_BUILD.md."
          gh release create "$TAG" \
            "$APK" "$EXE" "dist/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Internet Browser v$VERSION" \
            --notes "$RELEASE_NOTES"
