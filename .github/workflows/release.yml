name: Publish signed v0.x release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: internet-browser-production-release
  cancel-in-progress: false

jobs:
  prepare:
    # Never expose release credentials to pull_request code or other branches.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      version_code: ${{ steps.version.outputs.version_code }}
      publish: ${{ steps.existing.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate 0.x version and calculate increasing Android versionCode
        id: version
        run: python3 tool/release_metadata.py
      - name: Skip a version already released
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "This version is already published; leaving it unchanged."
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null 2>&1; then
            EXISTING_SHA=$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")
            if [ "$EXISTING_SHA" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $RELEASE_TAG points to a different commit."
              exit 1
            fi
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"

  quality:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Generate native project wrappers
        run: flutter create --project-name=internet_browser --org=io.github.sopo9880 --platforms=android,windows .
      - run: git show HEAD:test/widget_test.dart > test/widget_test.dart
      - run: python3 tool/prepare_platforms.py
      - name: Verify release signing template without accessing keys
        run: python3 tool/configure_android_signing.py
      - name: Check Python release metadata and signing helpers
        run: python3 -m unittest discover -s tool/tests -p 'test_*.py' -v
      - run: flutter pub get
      - name: Generate parcel launcher icon for Android and Windows
        run: dart run flutter_launcher_icons
      - run: dart format --output=write lib test
      - run: flutter analyze
      - run: flutter test

  android:
    needs: [prepare, quality]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    env:
      BROWSER_ANDROID_NDK_VERSION: '27.3.13750724'
      VERSION: ${{ needs.prepare.outputs.version }}
      VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Generate native Android project
        run: flutter create --project-name=internet_browser --org=io.github.sopo9880 --platforms=android .
      - run: python3 tool/prepare_platforms.py
      - run: flutter pub get
      - name: Generate parcel launcher icon for Android and Windows
        run: dart run flutter_launcher_icons
      - name: Materialize release keystore and configure Gradle
        # Secrets are available ONLY in this trusted, main-branch release job.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tool/configure_android_signing.py --write
      - name: Diagnose Android keystore and alias safely
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/internet-browser-release.p12"
          if [ ! -s "$KEYSTORE" ]; then
            echo "::error title=Android keystore::Decoded keystore file is missing or empty."
            exit 1
          fi
          if ! keytool -list -storetype PKCS12 \
            -keystore "$KEYSTORE" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD >/dev/null 2>&1; then
            echo "::error title=Android keystore password::Unable to open PKCS12 with ANDROID_KEYSTORE_PASSWORD. Verify the original .p12, Base64 secret and store password."
            exit 1
          fi
          if ! keytool -list -storetype PKCS12 \
            -keystore "$KEYSTORE" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error title=Android key alias::ANDROID_KEY_ALIAS does not match an alias in the PKCS12 keystore. Check the original keystore's alias locally and update the repository secret."
            exit 1
          fi
          if ! keytool -list -storetype PKCS12 \
            -keystore "$KEYSTORE" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -alias "$ANDROID_KEY_ALIAS" | grep -q 'PrivateKeyEntry'; then
            echo "::error title=Android key entry::The configured alias does not reference a signing private key."
            exit 1
          fi
          echo "Android signing keystore, password and private-key alias verified."
      - name: Build production-signed Android APK
        env:
          ANDROID_RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/internet-browser-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-name "$VERSION" --build-number "$VERSION_CODE"
      - name: Verify APK signature and stage distribution
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p dist
          cp "$APK" "dist/Internet-browser-Android-v$VERSION.apk"
          test -s "dist/Internet-browser-Android-v$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: release-signed-android-apk
          path: dist/Internet-browser-Android-v*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Delete temporary release key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/internet-browser-release.p12"

  windows:
    needs: [prepare, quality]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: windows-2022
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Generate Windows project
        run: flutter create --project-name=internet_browser --org=io.github.sopo9880 --platforms=windows .
      - run: flutter pub get
      - name: Generate parcel launcher icon for Android and Windows
        run: dart run flutter_launcher_icons
      - run: flutter build windows --release
      - name: Include verified ByeDPI Windows proxy engine
        shell: pwsh
        run: ./tool/install_byedpi.ps1
      - name: Find or install Inno Setup 6
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found."
          }
      - name: Produce Windows installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc "/DAppVersion=$env:VERSION" "installer\InternetBrowser.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup build failed." }
          $file = "dist\Internet-browser-Windows-Setup-v$env:VERSION.exe"
          if (-not (Test-Path $file)) { throw "Missing Windows installer." }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-installer
          path: dist/Internet-browser-Windows-Setup-v*.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [prepare, quality, android, windows]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-signed-android-apk
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-windows-installer
          path: dist
      - name: Verify exact asset names and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          APK="Internet-browser-Android-v$VERSION.apk"
          EXE="Internet-browser-Windows-Setup-v$VERSION.exe"
          test -s "dist/$APK"
          test -s "dist/$EXE"
          (cd dist && sha256sum "$APK" "$EXE" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Publish GitHub Release only after BOTH signed builds succeed
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/Internet-browser-Android-v$VERSION.apk"
          EXE="dist/Internet-browser-Windows-Setup-v$VERSION.exe"
          gh release create "$TAG" \
            "$APK" "$EXE" "dist/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Internet Browser v$VERSION" \
            --notes "Windows installer and Android APK signed using the stored release key. Read docs/UPDATES.md before upgrading. SHA-256 checksums are attached."
